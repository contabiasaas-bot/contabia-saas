<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContábIA SaaS - Plataforma Contábil com IA</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen overflow-hidden">

<div id="app" class="h-screen bg-slate-900 text-slate-100 font-sans flex flex-col">

  <!-- TELA DE LOGIN / ACESSO (Multi-Tenant) -->
  <div id="tela-login" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 w-full max-w-md space-y-6 shadow-2xl">
      <div class="text-center space-y-2">
        <div class="inline-block p-3 bg-blue-600/20 text-blue-400 rounded-2xl text-3xl font-bold">✨</div>
        <h1 class="text-2xl font-bold text-white">ContábIA SaaS</h1>
        <p class="text-xs text-slate-400">Plataforma Contábil Inteligente com Gemini 1.5 Flash</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Selecione o Escritório (Tenant)</label>
          <select id="login-escritorio" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
            <option value="Contabilidade Silva & Associados">Contabilidade Silva & Associados (SP)</option>
            <option value="Pires & Consultores Fiscais">Pires & Consultores Fiscais (RS)</option>
            <option value="Auditoria & Contabilidade Global">Auditoria & Contabilidade Global (RJ)</option>
          </select>
        </div>

        <div>
          <label class="text-xs text-slate-400 block mb-1">E-mail Profissional</label>
          <input type="email" id="login-email" placeholder="seu@email.com" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-600">
        </div>

        <div>
          <label class="text-xs text-slate-400 block mb-1">Senha de Acesso</label>
          <input type="password" id="login-senha" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-600">
        </div>

        <button type="button" onclick="entrarNoSistema()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl transition-colors shadow-lg shadow-blue-600/30">
          Entrar no Sistema (Área Segura)
        </button>

        <div class="text-center">
          <span class="text-xs text-slate-500">Supabase DB &bull; Gemini AI Ativo</span>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL DE NOVO CLIENTE -->
  <div id="modal-novo-cliente" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-lg space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-white text-base">Cadastrar Novo Cliente Manualmente</h3>
        <button type="button" onclick="fecharModalCliente()" class="text-slate-400 hover:text-white text-sm">✕</button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="text-slate-400 block mb-1">Nome da Empresa / Razão Social</label>
          <input type="text" id="form-nome" placeholder="Ex: Inovação Comércio LTDA" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
        </div>
        <div>
          <label class="text-slate-400 block mb-1">CNPJ</label>
          <input type="text" id="form-cnpj" placeholder="00.000.000/0001-00" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
        </div>
        <div>
          <label class="text-slate-400 block mb-1">Regime Tributário</label>
          <select id="form-regime" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white">
            <option>Simples Nacional</option>
            <option>Lucro Presumido</option>
            <option>Lucro Real</option>
            <option>MEI</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button type="button" onclick="fecharModalCliente()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium">Cancelar</button>
        <button type="button" onclick="salvarNovoCliente()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-medium">Salvar Cliente</button>
      </div>
    </div>
  </div>

  <!-- APLICAÇÃO PRINCIPAL -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Menu Lateral -->
    <aside class="w-64 bg-slate-950 border-r border-slate-800 flex flex-col justify-between">
      <div>
        <div class="p-5 border-b border-slate-800 flex items-center space-x-3">
          <div class="p-2 bg-blue-600 rounded-lg text-white font-bold text-xl">✨</div>
          <div>
            <h1 class="font-bold text-sm leading-tight text-white">ContábIA SaaS</h1>
            <span class="text-[10px] text-blue-400 font-medium">Plataforma com IA Real</span>
          </div>
        </div>

        <div class="p-3 border-b border-slate-800/60">
          <label class="text-[10px] text-slate-400 block mb-1 uppercase font-semibold">Cliente Selecionado</label>
          <select id="seletor-cliente-topo" onchange="mudarClienteManual(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white">
            <option value="Tech Solutions LTDA (CNPJ 12.345.67)">Tech Solutions LTDA (CNPJ 12.345.67)</option>
            <option value="Comércio Silva EIRELI (CNPJ 98.765.43)">Comércio Silva EIRELI (CNPJ 98.765.43)</option>
          </select>
        </div>

        <nav id="menu-modulos" class="p-2 space-y-1 text-xs overflow-y-auto max-h-[calc(100vh-240px)]">
          <button type="button" onclick="mudarAba('dashboard', this)" class="w-full text-left px-3 py-2 rounded-lg bg-blue-600 text-white font-semibold flex items-center space-x-2 transition">
            <span>📊</span><span>1. Dashboard Geral</span>
          </button>
          <button type="button" onclick="mudarAba('entradas', this)" class="w-full text-left px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-900 hover:text-white flex items-center space-x-2 transition">
            <span>📥</span><span>2. Módulo de Entradas & OCR</span>
          </button>
          <button type="button" onclick="mudarAba('lancamentos', this)" class="w-full text-left px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-900 hover:text-white flex items-center space-x-2 transition">
            <span>💰</span><span>3. Lançamentos Contábeis</span>
          </button>
          <button type="button" onclick="mudarAba('conciliacao', this)" class="w-full text-left px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-900 hover:text-white flex items-center space-x-2 transition">
            <span>🔄</span><span>4. Conciliação Bancária IA</span>
          </button>
          <button type="button" onclick="mudarAba('relatorios', this)" class="w-full text-left px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-900 hover:text-white flex items-center space-x-2 transition">
            <span>📑</span><span>5. Relatórios Oficiais IA</span>
          </button>
          <button type="button" onclick="mudarAba('auditoria', this)" class="w-full text-left px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-900 hover:text-white flex items-center space-x-2 transition">
            <span>🤖</span><span>6. Auditoria & Chat IA</span>
          </button>
          <button type="button" onclick="mudarAba('calendario', this)" class="w-full text-left px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-900 hover:text-white flex items-center space-x-2 transition">
            <span>📅</span><span>7. Calendário Fiscal</span>
          </button>
          <button type="button" onclick="mudarAba('clientes', this)" class="w-full text-left px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-900 hover:text-white flex items-center space-x-2 transition">
            <span>🏢</span><span>8. Gestão de Clientes</span>
          </button>
          <button type="button" onclick="mudarAba('configuracoes', this)" class="w-full text-left px-3 py-2 rounded-lg text-slate-400 hover:bg-slate-900 hover:text-white flex items-center space-x-2 transition">
            <span>⚙️</span><span>9. Configurações & API</span>
          </button>
        </nav>
      </div>

      <div class="p-3 border-t border-slate-800 bg-slate-900/50 flex justify-between items-center">
        <div>
          <p id="txt-escritorio-ativo" class="text-xs font-semibold text-white truncate max-w-[140px]">Contabilidade Silva</p>
          <span class="text-[10px] text-emerald-400">● Supabase & Gemini Ativos</span>
        </div>
        <button type="button" onclick="fazerLogout()" class="text-xs text-red-400 hover:underline">Sair</button>
      </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="flex-1 flex flex-col overflow-hidden bg-slate-900">
      <header class="h-16 border-b border-slate-800 flex items-center justify-between px-6 bg-slate-950/40">
        <h2 id="titulo-pagina" class="font-bold text-white text-base">1. Dashboard Geral</h2>
        <div class="flex items-center space-x-3">
          <div class="text-right">
            <p class="text-xs font-medium text-white">Contador Responsável</p>
            <p class="text-[10px] text-slate-400">CRC/RS - Contábil</p>
          </div>
          <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-white text-xs">KG</div>
        </div>
      </header>

      <div id="conteudo-dinamico" class="flex-1 overflow-y-auto p-6 space-y-6">
        <!-- Renderizado dinamicamente -->
      </div>
    </main>
  </div>
</div>

<input type="file" id="input-arquivo-oculto" class="hidden" onchange="lidarComUploadReal(this)" />

<script>
  const SUPABASE_URL = 'https://dvqogjwklssxbmzdrcst.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2cW9nandrbHNzeGJtemRyY3N0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwNjY5NzAsImV4cCI6MjEwOTY0Mjk3MH0.OijYK5A012OkicFjvisZ7ad12n647oW_C2Fx2Uiyl1U';
  
  let supabaseClient = null;
  try {
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  } catch (e) {
    console.error("Erro ao inicializar Supabase:", e);
  }

  // COLE A SUA CHAVE REAL EXATA ENTRE AS ASPAS ABAIXO:
  let GEMINI_API_KEY = "SUA_CHAVE_COMPLETA_AQUI"; 

  let clienteAtual = "Tech Solutions LTDA (CNPJ 12.345.67)";
  let listaClientesSupabase = [];

  window.chamarGeminiAPI = async function(promptCompleto) {
    if (!GEMINI_API_KEY || GEMINI_API_KEY.includes("SUA_CHAVE")) {
      return "⚠️ Erro: Chave de API do Gemini não configurada corretamente no código.";
    }

    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
    
    try {
      const resposta = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptCompleto }] }]
        })
      });

      const dados = await resposta.json();
      if (dados.candidates && dados.candidates[0]?.content?.parts?.[0]?.text) {
        return dados.candidates[0].content.parts[0].text;
      } else if (dados.error) {
        console.error("Erro no Gemini:", dados.error.message);
        return `Erro da API: ${dados.error.message}`;
      } else {
        return "Erro: A API não retornou conteúdo válido.";
      }
    } catch (erro) {
      console.error("Falha na chamada ao Gemini:", erro);
      return "Erro de conexão com a API do Gemini.";
    }
  };

  window.entrarNoSistema = function() {
    const email = document.getElementById('login-email').value;
    const senha = document.getElementById('login-senha').value;
    const escritorio = document.getElementById('login-escritorio').value;

    if (!email || !senha) {
      alert('Por favor, preencha o e-mail e a senha.');
      return;
    }

    document.getElementById('txt-escritorio-ativo').innerText = escritorio.split(' ')[0];
    document.getElementById('tela-login').style.display = 'none';
  };

  window.fazerLogout = function() {
    document.getElementById('tela-login').style.display = 'flex';
  };

  window.abrirModalCliente = function() {
    document.getElementById('modal-novo-cliente').classList.remove('hidden');
  };

  window.fecharModalCliente = function() {
    document.getElementById('modal-novo-cliente').classList.add('hidden');
  };

  window.salvarNovoCliente = function() {
    const nome = document.getElementById('form-nome').value;
    if(!nome) {
      alert('Insira o nome da empresa.');
      return;
    }
    alert(`Cliente "${nome}" cadastrado com sucesso!`);
    fecharModalCliente();
  };

  window.acederWorkspaceCliente = function(nomeCliente) {
    clienteAtual = nomeCliente;
    document.getElementById('seletor-cliente-topo').value = nomeCliente;
    window.mudarAba('dashboard', document.querySelector('#menu-modulos button'));
  };

  window.mudarClienteManual = function(valor) {
    clienteAtual = valor;
    window.mudarAba('dashboard', document.querySelector('#menu-modulos button'));
  };

  window.salvarConfiguracoes = function() {
    const novaChave = document.getElementById('input-gemini-key').value.trim();
    if (novaChave) {
      GEMINI_API_KEY = novaChave;
      alert('Chave atualizada com sucesso no código em execução!');
    } else {
      alert('Por favor, insira uma chave válida.');
    }
  };

  window.lidarComUploadReal = async function(input) {
    if (input.files && input.files[0]) {
      const nomeFicheiro = input.files[0].name;
      const statusEl = document.getElementById('status-upload');
      const nomeEl = document.getElementById('nome-arquivo-carregado');
      
      if (statusEl && nomeEl) {
        nomeEl.innerText = `Processando "${nomeFicheiro}" via Gemini OCR...`;
        statusEl.classList.remove('hidden');
      }

      const promptOCR = `Analise o documento contábil "${nomeFicheiro}" para a empresa ${clienteAtual}. Faça um resumo contábil de 1 frase.`;
      const resultadoIA = await window.chamarGeminiAPI(promptOCR);

      if (statusEl && nomeEl) {
        nomeEl.innerText = resultadoIA ? `IA: ${resultadoIA}` : `Ficheiro "${nomeFicheiro}" carregado com sucesso.`;
      }
    }
  };

  window.gerarLancamentosComIA = async function() {
    const caixaEl = document.getElementById('caixa-lancamentos-ia');
    if (!caixaEl) return;
    
    caixaEl.innerHTML = "<em>Gerando lançamentos com Gemini...</em>";
    const prompt = `Gere 1 lançamento contábil em partida dobrada (Débito e Crédito) para ${clienteAtual}.`;
    
    const resposta = await window.chamarGeminiAPI(prompt);
    caixaEl.innerHTML = resposta ? resposta.replace(/\n/g, '<br>') : "D - Banco: R$ 4.500,00<br>C - Receita: R$ 4.500,00";
  };

  window.executarConciliacaoIA = async function() {
    const statusEl = document.getElementById('status-conciliacao-ia');
    if (!statusEl) return;

    statusEl.innerHTML = "<span>Consultando Gemini...</span>";
    const prompt = `Faça uma verificação de conciliação para ${clienteAtual}. Diga se está correto em 1 frase.`;
    
    const resposta = await window.chamarGeminiAPI(prompt);
    statusEl.innerHTML = resposta ? `<span>Extrato vs Livro Caixa</span><span class='text-emerald-400 font-semibold'>✔ ${resposta}</span>` : `<span>Extrato vs Livro Caixa</span><span class='text-emerald-400 font-semibold'>✔ Conciliado</span>`;
  };

  window.perguntarParaGemini = async function() {
    const input = document.getElementById('input-pergunta-ia');
    const historico = document.getElementById('chat-historico');
    const pergunta = input.value.trim();
    
    if (!pergunta) return;

    historico.innerHTML += `<p class="text-right text-white"><strong class="text-emerald-400">Você:</strong> ${pergunta}</p>`;
    input.value = '';
    historico.scrollTop = historico.scrollHeight;

    const idCarregando = "loading-" + Date.now();
    historico.innerHTML += `<p id="${idCarregando}"><strong class="text-blue-400">🤖 Gemini:</strong> Pensando...</p>`;
    historico.scrollTop = historico.scrollHeight;

    const promptContexto = `Aja como auditor contábil. Responda sobre ${clienteAtual}: ${pergunta}`;
    const respostaIA = await window.chamarGeminiAPI(promptContexto);
    
    const elCarregando = document.getElementById(idCarregando);
    if (elCarregando) elCarregando.remove();

    if (respostaIA) {
      historico.innerHTML += `<p><strong class="text-blue-400">🤖 Gemini 1.5 Flash:</strong> ${respostaIA.replace(/\n/g, '<br>')}</p>`;
    } else {
      historico.innerHTML += `<p class="text-red-400"><strong>Erro:</strong> Não foi possível obter resposta da IA.</p>`;
    }

    historico.scrollTop = historico.scrollHeight;
  };

  const telas = {
    dashboard: () => `
      <div class="flex-1 p-6 overflow-y-auto space-y-6">
        <div class="p-3 bg-blue-950/40 border border-blue-800/50 rounded-xl text-xs text-blue-300 flex items-center space-x-2">
          <span>📁</span> <span><strong>Workspace Ativo:</strong> Exibindo dados de <strong>${clienteAtual}</strong></span>
        </div>
        <div onclick="document.getElementById('input-arquivo-oculto').click();" class="p-6 border-2 border-dashed border-slate-700 rounded-xl text-center space-y-2 bg-slate-800/50 cursor-pointer hover:border-blue-500 transition">
          <p class="text-2xl">📤</p>
          <p class="text-sm font-medium text-slate-200">Upload de Documento (PDF, XML, OFX, XLSX)</p>
          <p class="text-xs text-slate-400">Clique para selecionar arquivos do computador</p>
        </div>
        <div id="status-upload" class="hidden p-4 bg-emerald-950/40 border border-emerald-700/50 rounded-xl text-xs text-emerald-300">
          <span>✅</span> <span id="nome-arquivo-carregado">Arquivo processado com sucesso!</span>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="p-4 bg-slate-800 rounded-xl border border-slate-700">
            <p class="text-xs text-slate-400">Faturamento Bruto</p>
            <p class="text-2xl font-bold text-white mt-1">${clienteAtual.includes('Tech') ? 'R$ 148.500,00' : 'R$ 92.400,00'}</p>
          </div>
          <div class="p-4 bg-slate-800 rounded-xl border border-slate-700">
            <p class="text-xs text-slate-400">Impostos Calculados</p>
            <p class="text-2xl font-bold text-white mt-1">${clienteAtual.includes('Tech') ? 'R$ 12.380,45' : 'R$ 5.544,00'}</p>
          </div>
        </div>
      </div>
    `,
    entradas: () => `
      <div class="space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-white text-lg">Módulo de Entradas & OCR</h3>
          <button type="button" onclick="document.getElementById('input-arquivo-oculto').click();" class="px-3 py-2 bg-blue-600 text-white rounded-lg text-xs font-medium">📥 Enviar Nota Fiscal</button>
        </div>
        <div class="p-4 bg-slate-800 rounded-xl border border-slate-700 text-sm">
          <table class="w-full text-left">
            <thead class="text-xs text-slate-400 border-b border-slate-700">
              <tr><th class="pb-2">Documento</th><th class="pb-2">Emissor</th><th class="pb-2">Valor</th><th class="pb-2">Status IA</th></tr>
            </thead>
            <tbody class="divide-y divide-slate-700/50 text-xs">
              <tr><td class="py-3">NF-e 1042</td><td>${clienteAtual.split(' ')[0]}</td><td>R$ 4.500,00</td><td><span class="text-green-400">Processado Gemini OCR</span></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    `,
    lancamentos: () => `
      <div class="space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-white text-lg">Lançamentos Contábeis</h3>
          <button type="button" onclick="gerarLancamentosComIA()" class="px-3 py-2 bg-blue-600 text-white rounded-lg text-xs font-medium">✨ Partidas Dobradas com Gemini</button>
        </div>
        <div class="p-4 bg-slate-800 rounded-xl border border-slate-700 text-xs space-y-3">
          <div id="caixa-lancamentos-ia" class="bg-slate-900 p-3 rounded-lg border border-slate-700 font-mono text-slate-200">
            D - Banco Conta Movimento: R$ 4.500,00<br>
            C - Receita de Serviços: R$ 4.500,00
          </div>
        </div>
      </div>
    `,
    conciliacao: () => `
      <div class="space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-white text-lg">Conciliação Bancária IA</h3>
          <button type="button" onclick="executarConciliacaoIA()" class="px-3 py-2 bg-emerald-600 text-white rounded-lg text-xs font-medium">🔄 Auditar com Gemini</button>
        </div>
        <div class="p-4 bg-slate-800 rounded-xl border border-slate-700 text-xs space-y-3">
          <div id="status-conciliacao-ia" class="flex justify-between items-center bg-slate-900 p-3 rounded-lg border border-slate-700">
            <span>Extrato Bancário vs. Livro Caixa</span>
            <span class="text-emerald-400 font-semibold">✔ Conciliado</span>
          </div>
        </div>
      </div>
    `,
    relatorios: () => `
      <div class="space-y-4">
        <h3 class="font-bold text-white text-lg">Relatórios Oficiais IA</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="p-4 bg-slate-800 rounded-xl border border-slate-700 space-y-2">
            <p class="font-bold text-white">DRE Gerencial</p>
            <button type="button" onclick="alert('Gerando PDF DRE...')" class="px-3 py-1.5 bg-blue-600 text-white rounded text-xs">📄 Baixar DRE (.PDF)</button>
          </div>
          <div class="p-4 bg-slate-800 rounded-xl border border-slate-700 space-y-2">
            <p class="font-bold text-white">Balanço Patrimonial</p>
            <button type="button" onclick="alert('Gerando Balanço...')" class="px-3 py-1.5 bg-blue-600 text-white rounded text-xs">📊 Baixar Balanço (.PDF)</button>
          </div>
        </div>
      </div>
    `,
    auditoria: () => `
      <div class="space-y-4">
        <h3 class="font-bold text-white text-lg">Auditoria & Chat com Google Gemini 1.5 Flash</h3>
        <div class="p-4 bg-slate-800 rounded-xl border border-slate-700 space-y-3">
          <div id="chat-historico" class="bg-slate-900 p-3 rounded-lg border border-slate-700 text-xs text-slate-300 space-y-2 max-h-48 overflow-y-auto">
            <p><strong class="text-blue-400">🤖 Assistente ContábIA:</strong> Olá! Como posso ajudar na fiscalidade hoje?</p>
          </div>
          <div class="flex space-x-2">
            <input type="text" id="input-pergunta-ia" placeholder="Digite sua pergunta..." class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none">
            <button type="button" onclick="perguntarParaGemini()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-medium">Perguntar à IA</button>
          </div>
        </div>
      </div>
    `,
    calendario: () => `
      <div class="space-y-4">
        <h3 class="font-bold text-white text-lg">Calendário Fiscal</h3>
        <div class="p-4 bg-slate-800 rounded-xl border border-slate-700 text-xs space-y-2">
          <div class="flex justify-between items-center p-2 bg-slate-900 rounded border border-slate-700">
            <span>DAS - Simples Nacional</span>
            <span class="text-red-400 font-semibold">Vence em 20/10/2026</span>
          </div>
        </div>
      </div>
    `,
    clientes: () => `
      <div class="space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-white text-lg">Gestão de Clientes</h3>
          <button type="button" onclick="abrirModalCliente()" class="px-3 py-2 bg-blue-600 text-white rounded-lg text-xs font-medium">➕ Novo Cliente</button>
        </div>
        <div class="p-4 bg-slate-800 rounded-xl border border-slate-700 text-xs space-y-3">
          <div class="flex justify-between items-center p-2 rounded-lg bg-slate-700/40">
            <span>Tech Solutions LTDA</span>
            <button type="button" onclick="acederWorkspaceCliente('Tech Solutions LTDA (CNPJ 12.345.67)')" class="px-3 py-1.5 bg-blue-600 text-white rounded-lg font-semibold">📂 Aceder Workspace</button>
          </div>
        </div>
      </div>
    `,
    configuracoes: () => `
      <div class="space-y-4">
        <h3 class="font-bold text-white text-lg">Configurações & API</h3>
        <div class="p-4 bg-slate-800 rounded-xl border border-slate-700 text-xs space-y-3">
          <div>
            <label class="text-slate-400 block mb-1">Chave API Google Gemini 1.5 Flash</label>
            <input type="password" id="input-gemini-key" value="${GEMINI_API_KEY}" placeholder="Cole sua chave aqui..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white">
          </div>
          <button type="button" onclick="salvarConfiguracoes()" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium">Salvar Configurações</button>
        </div>
      </div>
    `
  };

  window.mudarAba = function(nomeAba, elemento) {
    const conteudoFn = telas[nomeAba] || (() => `<div class="p-4 bg-slate-800 rounded-xl border border-slate-700">Módulo em execução para <strong>${clienteAtual}</strong></div>`);
    document.getElementById('conteudo-dinamico').innerHTML = conteudoFn();
    
    if (nomeAba === 'configuracoes') {
      const inputKey = document.getElementById('input-gemini-key');
      if (inputKey) inputKey.value = GEMINI_API_KEY;
    }
    
    const titulosMap = {
      dashboard: '1. Dashboard Geral',
      entradas: '2. Módulo de Entradas & OCR',
      lancamentos: '3. Lançamentos Contábeis',
      conciliacao: '4. Conciliação Bancária IA',
      relatorios: '5. Relatórios Oficiais IA',
      auditoria: '6. Auditoria & Chat IA',
      calendario: '7. Calendário Fiscal',
      clientes: '8. Gestão de Clientes',
      configuracoes: '9. Configurações & API'
    };
    document.getElementById('titulo-pagina').innerText = titulosMap[nomeAba] || 'ContábIA SaaS';

    document.querySelectorAll('#menu-modulos button').forEach(btn => {
      btn.classList.remove('bg-blue-600', 'text-white', 'font-semibold');
      btn.classList.add('text-slate-400', 'hover:bg-slate-900', 'hover:text-white');
    });
    if(elemento) {
      elemento.classList.remove('text-slate-400', 'hover:bg-slate-900', 'hover:text-white');
      elemento.classList.add('bg-blue-600', 'text-white', 'font-semibold');
    }
  };

  window.mudarAba('dashboard', document.querySelector('#menu-modulos button'));
</script>
</body>
</html>
