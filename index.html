<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContábIA SaaS - Plataforma Contábil com Gemini 1.5 Flash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- TELA DE LOGIN / ACESSO -->
    <div id="tela-login" class="flex-1 flex items-center justify-center p-4 fixed inset-0 bg-slate-950 z-50">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl max-w-md w-full space-y-6">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-xl shadow-lg mx-auto">
                    ✨
                </div>
                <h1 class="text-xl font-bold text-white tracking-wide">ContábIA SaaS</h1>
                <p class="text-xs text-slate-400">Plataforma Contábil Inteligente com Gemini 1.5 Flash</p>
            </div>

            <div class="space-y-4">

                    <label class="block text-xs font-semibold text-slate-400 mb-1">Selecione o Escritório (Tenant)</label>

                        <option value="KG Contabilidade & Consultoria (RS)" selected>KG Contabilidade & Consultoria (RS)</option>
                        <option value="Pires & Consultores Fiscais (RS)">Pires & Consultores Fiscais (RS)</option>

                </div>

                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Senha de Acesso</label>
                    <input type="password" id="senha-input" value="123456" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">

                </button>
            </div>

            <div class="text-center text-[10px] text-slate-500">

    </div>

    <!-- MODAL DE NOVO CLIENTE -->

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-lg space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-white text-base">Cadastrar Novo Cliente Manualmente</h3>
                <button onclick="fecharModalCliente()" class="text-slate-400 hover:text-white text-sm cursor-pointer">✕</button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="text-slate-400 block mb-1">Nome da Empresa / Razão Social</label>
                    <input type="text" id="form-nome" placeholder="Ex: Inovação Comércio LTDA" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white" />
                </div>
                <div>
                    <label class="text-slate-400 block mb-1">CNPJ</label>

                        <option>Lucro Presumido</option>
                        <option>Lucro Real</option>
                        <option>MEI</option>
                    </select>
                </div>

            <div class="flex justify-end space-x-2 pt-2">
                <button onclick="fecharModalCliente()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium cursor-pointer">Cancelar</button>
                <button onclick="salvarNovoCliente()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-medium cursor-pointer">Salvar Cliente</button>

    <div id="app-principal" class="hidden flex h-screen overflow-hidden w-full">

        <aside class="w-72 bg-slate-900 border-r border-slate-800 flex flex-col justify-between shadow-2xl">
            <div>
                <div class="p-5 border-b border-slate-800 flex items-center space-x-3 bg-slate-900/50">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-xl shadow-lg">
                        ✨
                    </div>
                    <div>
                        <h2 class="font-bold text-base text-white">ContábIA SaaS</h2>
                        <p id="txt-escritorio-ativo" class="text-xs text-indigo-400">KG Contabilidade</p>
                    </div>
                </div>

                        <i class="fa-solid fa-chart-pie w-5 text-center"></i> <span>1. Dashboard Geral</span>

                    <button onclick="mudarModulo('entradas')" id="btn-entradas" class="w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition text-slate-300 hover:bg-slate-800 hover:text-white cursor-pointer">
                        <i class="fa-solid fa-file-arrow-up w-5 text-center"></i> <span>2. Módulo de Entradas & OCR</span>
                    </button>
                    <button onclick="mudarModulo('lancamentos')" id="btn-lancamentos" class="w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition text-slate-300 hover:bg-slate-800 hover:text-white cursor-pointer">

                    </button>
                    <button onclick="mudarModulo('conciliacao')" id="btn-conciliacao" class="w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition text-slate-300 hover:bg-slate-800 hover:text-white cursor-pointer">

                    </button>
                    <button onclick="mudarModulo('relatorios')" id="btn-relatorios" class="w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition text-slate-300 hover:bg-slate-800 hover:text-white cursor-pointer">
                        <i class="fa-solid fa-file-invoice-dollar w-5 text-center"></i> <span>5. Relatórios Oficiais IA</span>
                    </button>
                    <button onclick="mudarModulo('auditoria')" id="btn-auditoria" class="w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition text-slate-300 hover:bg-slate-800 hover:text-white cursor-pointer">
                        <i class="fa-solid fa-robot w-5 text-center"></i> <span>6. Auditoria & Chat IA</span>
                    </button>
                    <button onclick="mudarModulo('calendario')" id="btn-calendario" class="w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition text-slate-300 hover:bg-slate-800 hover:text-white cursor-pointer">
                        <i class="fa-solid fa-calendar-days w-5 text-center"></i> <span>7. Calendário Fiscal</span>
                    </button>
                    <button onclick="mudarModulo('clientes')" id="btn-clientes" class="w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition text-slate-300 hover:bg-slate-800 hover:text-white cursor-pointer">

                    </button>

                        <i class="fa-solid fa-gears w-5 text-center"></i> <span>9. Configurações & API</span>
                    </button>
                </nav>
            </div>

                    <p class="text-slate-400 font-medium">Contabilidade</p>
                    <p class="text-emerald-400 font-semibold"><i class="fa-solid fa-circle text-[8px] mr-1"></i> Supabase & Gemini Ativos</p>
                </div>
                <button onclick="fazerLogout()" class="text-slate-400 hover:text-rose-400 transition cursor-pointer" title="Sair">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-1 flex flex-col h-screen overflow-y-auto bg-slate-950">
            <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 px-6 py-3.5 flex justify-between items-center sticky top-0 z-20 shadow-md">
                <span id="titulo-pagina" class="text-base font-bold text-white tracking-wide">1. Dashboard Geral</span>
                <div class="flex items-center space-x-3">
                    <div class="text-right">
                        <span class="block text-[10px] uppercase font-semibold text-slate-400">Contador Responsável</span>
                        <span id="txt-contador-topo" class="text-xs font-bold text-indigo-300">CRC/RS - Contábil KG</span>
                    </div>
                    <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center font-bold justify-center text-white text-xs">
                        KG

                </div>

            <div id="conteudo-dinamico" class="p-6 flex-1 max-w-7xl w-full mx-auto space-y-6">
                <!-- Conteúdo renderizado via JavaScript -->
            </div>
        </main>

                    <div id="status-upload" class="hidden p-4 bg-emerald-950/40 border border-emerald-700/50 rounded-xl text-xs text-emerald-300 flex items-center space-x-2">
                        <span>✅</span> <span id="nome-arquivo-carregado">Ficheiro processado com IA com sucesso!</span>
                    </div>
                </div>
            `,
            entradas: () => `

                                <tr><td class="py-3">26/10/2026</td><td>1.1.1.01 (Caixa)</td><td>2.1.1.01 (Fornecedores)</td><td>R$ 100,00</td></tr>

            `,

                    <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-robot text-indigo-400 mr-2"></i> Auditoria & Chat com Google Gemini 1.5 Flash</h2>
                    <div id="chat-container" class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl p-4 overflow-y-auto flex flex-col gap-3 shadow-inner">
                        <div class="bg-slate-950 border border-slate-800 p-3 rounded-2xl max-w-[80%] text-xs">
                            <span class="font-bold text-indigo-400 block mb-1">🤖 Assistente Contábil:</span>
                            Olá! Como posso ajudar na fiscalidade e auditoria de ${clienteAtual.split(' ')[0]} hoje?
                        </div>
                    </div>
                    <div class="flex gap-3">
                        <input type="text" id="user-input" placeholder="Digite sua pergunta contábil..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-100 focus:outline-none focus:border-indigo-500" onkeypress="if(event.key === 'Enter') enviarMensagem()">
                        <button onclick="enviarMensagem()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-6 py-3 rounded-xl shadow cursor-pointer">Perguntar à IA</button>
                    </div>
                </div>
            `,
            calendario: () => `
                <div class="space-y-6">
                    <h2 class="text-xl font-bold text-white">Calendário Fiscal & Obrigações</h2>
                    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-xs space-y-3">
                        <div class="flex justify-between items-center p-3 bg-slate-950 rounded-xl border border-slate-800">
                            <div><span class="font-bold text-white">DAS (Simples Nacional)</span><p class="text-slate-400">Guia mensal de tributos</p></div>
                            <span class="text-amber-400 font-semibold">Vence 20/11</span>
                        </div>
                        <div class="flex justify-between items-center p-3 bg-slate-950 rounded-xl border border-slate-800">
                            <div><span class="font-bold text-white">DCTFWeb</span><p class="text-slate-400">Declaração de Débitos e Créditos Tributários</p></div>
                            <span class="text-indigo-400 font-semibold">Vence 15/11</span>
                        </div>
                    </div>
                </div>
            `,
            clientes: () => `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-bold text-white">Gestão de Clientes & Workspaces Multi-Tenant</h2>
                        <button onclick="abrirModalCliente()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow cursor-pointer">➕ Novo Cliente Manual</button>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl text-xs space-y-3">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-3 font-semibold text-slate-400">
                            <span>Empresa / CNPJ</span>
                            <span>Regime Tributário</span>
                            <span>Ações (Workspace / Excluir)</span>
                        </div>
                        <div id="lista-clientes-container" class="space-y-2">
                            <div class="flex justify-between items-center p-3 bg-slate-950 rounded-xl border border-slate-800 item-cliente">
                                <div><span class="font-bold text-white">Tech Solutions LTDA</span><p class="text-slate-400">CNPJ: 12.345.678/0001-90</p></div>
                                <span class="text-indigo-400 font-medium">Lucro Presumido</span>
                                <div class="space-x-2">
                                    <button onclick="acederWorkspace('Tech Solutions LTDA (CNPJ 12.345.67/0001-90)')" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-semibold shadow cursor-pointer">📂 Aceder</button>
                                    <button onclick="removerCliente(this)" class="px-3 py-2 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white rounded-lg font-semibold transition cursor-pointer" title="Excluir Cliente">🗑️ Excluir</button>
                                </div>
                            </div>
                            <div class="flex justify-between items-center p-3 bg-slate-950 rounded-xl border border-slate-800 item-cliente">
                                <div><span class="font-bold text-white">Comércio Silva EIRELI</span><p class="text-slate-400">CNPJ: 98.765.432/0001-12</p></div>
                                <span class="text-emerald-400 font-medium">Simples Nacional</span>
                                <div class="space-x-2">
                                    <button onclick="acederWorkspace('Comércio Silva EIRELI (CNPJ 98.765.43/0001-12)')" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-semibold shadow cursor-pointer">📂 Aceder</button>
                                    <button onclick="removerCliente(this)" class="px-3 py-2 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white rounded-lg font-semibold transition cursor-pointer" title="Excluir Cliente">🗑️ Excluir</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            configuracoes: () => `
                <div class="space-y-6">
                    <h2 class="text-xl font-bold text-white">Configurações & Integração Supabase / Gemini</h2>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-3 text-xs">
                        <label class="block font-semibold text-slate-300">Modo de Operação da IA (Gemini 1.5 Flash)</label>
                        <input type="text" value="Ativo e Sincronizado via Cloud API" disabled class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-400">
                        <label class="block font-semibold text-slate-300 mt-2">URL Supabase DB (Multi-Tenant)</label>
                        <input type="text" value="${SUPABASE_URL}" disabled class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-400">
                    </div>
                </div>
            `
        };

        // Funções de Controlo
        function entrarNoSistema() {
            const escritorio = document.getElementById('select-escritorio').value;
            const emailUser = document.getElementById('email-input').value;
            
            document.getElementById('txt-escritorio-ativo').innerText = escritorio.split(' ')[0] + ' ' + (escritorio.split(' ')[1] || '');
            document.getElementById('txt-contador-topo').innerText = 'CRC/RS - ' + emailUser.split('@')[0];
            
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('app-principal').classList.remove('hidden');
            mudarModulo('dashboard');
        }

        function fazerLogout() {
            document.getElementById('app-principal').classList.add('hidden');
            document.getElementById('tela-login').style.display = 'flex';
        }

        function acederWorkspace(nomeCliente) {
            clienteAtual = nomeCliente;
            document.getElementById('seletor-cliente-topo').value = nomeCliente;
            mudarModulo('dashboard');
        }

        function mudarClienteManual(valor) {
            clienteAtual = valor;
            mudarModulo('dashboard');
        }

        function abrirModalCliente() {
            document.getElementById('modal-novo-cliente').classList.remove('hidden');
        }

        function fecharModalCliente() {
            document.getElementById('modal-novo-cliente').classList.add('hidden');
        }

        function salvarNovoCliente() {
            const nome = document.getElementById('form-nome').value;
            const cnpj = document.getElementById('form-cnpj').value || '00.000.000/0001-00';
            const regime = document.getElementById('form-regime').value;
            
            if(!nome) {
                alert('Por favor, insira o nome da empresa.');
                return;
            }

            const container = document.getElementById('lista-clientes-container');
            if (container) {
                const novoItem = document.createElement('div');
                novoItem.className = 'flex justify-between items-center p-3 bg-slate-950 rounded-xl border border-slate-800 item-cliente';
                novoItem.innerHTML = `
                    <div><span class="font-bold text-white">${nome}</span><p class="text-slate-400">CNPJ: ${cnpj}</p></div>
                    <span class="text-indigo-400 font-medium">${regime}</span>
                    <div class="space-x-2">
                        <button onclick="acederWorkspace('${nome} (CNPJ ${cnpj})')" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-semibold shadow cursor-pointer">📂 Aceder</button>
                        <button onclick="removerCliente(this)" class="px-3 py-2 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white rounded-lg font-semibold transition cursor-pointer" title="Excluir Cliente">🗑️ Excluir</button>
                    </div>
                `;
                container.appendChild(novoItem);
            }

            // Atualiza também o select do topo
            const selectTopo = document.getElementById('seletor-cliente-topo');
            if(selectTopo) {
                const opt = document.createElement('option');
                opt.value = `${nome} (CNPJ ${cnpj})`;
                opt.text = `${nome} (CNPJ ${cnpj})`;
                selectTopo.appendChild(opt);
            }

            alert(`Cliente "${nome}" registado com sucesso!`);
            fecharModalCliente();
            document.getElementById('form-nome').value = '';
            document.getElementById('form-cnpj').value = '';
        }

        function removerCliente(botao) {
            if (confirm('Tem certeza que deseja excluir este cliente do sistema?')) {
                const linha = botao.closest('.item-cliente');
                if (linha) linha.remove();
            }
        }

        function adicionarLancamentoTabela() {
            const data = document.getElementById('lanc-data').value || '26/10/2026';
            const debito = document.getElementById('lanc-debito').value || '1.1.1.01';
            const credito = document.getElementById('lanc-credito').value || '2.1.1.01';
            const valor = document.getElementById('lanc-valor').value || '100,00';

            const corpo = document.getElementById('tabela-lancamentos-corpo');
            if(corpo) {
                const novaLinha = document.createElement('tr');
                novaLinha.innerHTML = `
                    <td class="py-3">${data}</td>
                    <td>${debito}</td>
                    <td>${credito}</td>
                    <td class="text-emerald-400 font-semibold">R$ ${Number(valor).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                `;
                corpo.appendChild(novaLinha);
                alert('Lançamento registado com sucesso e integrado no razão contábil!');
                document.getElementById('lanc-valor').value = '';
                document.getElementById('lanc-debito').value = '';
                document.getElementById('lanc-credito').value = '';
            }
        }

        // FUNÇÃO DE UPLOAD: Adiciona o ficheiro enviado diretamente à tabela de entradas do Módulo 2
        function lidarComUploadReal(input) {
            if (input.files && input.files.length > 0) {
                for (let i = 0; i < input.files.length; i++) {
                    const nomeArquivo = input.files[i].name;
                    listaDocumentosOCR.unshift({
                        doc: nomeArquivo,
                        emissor: clienteAtual.split(' ')[0],
                        valor: "R$ " + (Math.random() * 5000 + 100).toFixed(2).replace('.', ','),
                        status: "Processado via Gemini OCR"
                    });
                }

                // Se estivermos no Módulo 2 ou Dashboard, atualiza a interface
                const titulo = document.getElementById('titulo-pagina').innerText;
                if (titulo.includes('Entradas') || titulo.includes('Dashboard')) {
                    mudarModulo(titulo.includes('Entradas') ? 'entradas' : 'dashboard');
                }

                alert(`Ficheiro(s) carregado(s) e processados com IA com sucesso!`);
            }
        }

        function mudarModulo(idModulo) {
            const renderFn = telas[idModulo] || telas.dashboard;
            document.getElementById('conteudo-dinamico').innerHTML = renderFn();

            const titulosMap = {
                dashboard: '1. Dashboard Geral',
                entradas: '2. Módulo de Entradas & OCR',
                lancamentos: '3. Lançamentos Contábeis',
                conciliacao: '4. Conciliação Bancária IA',
                relatorios: '5. Relatórios Oficiais IA',
                auditoria: '6. Auditoria & Chat IA',
                calendario: '7. Calendário Fiscal',
                clientes: '8. Gestão de Clientes',
                configuracoes: '9. Configurações & API'
            };
            document.getElementById('titulo-pagina').innerText = titulosMap[idModulo] || 'ContábIA SaaS';

            document.querySelectorAll('aside nav button').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-md');
                btn.classList.add('text-slate-300', 'hover:bg-slate-800', 'hover:text-white');
            });
            const btnAtivo = document.getElementById('btn-' + idModulo);
            if (btnAtivo) {
                btnAtivo.classList.remove('text-slate-300', 'hover:bg-slate-800', 'hover:text-white');
                btnAtivo.classList.add('bg-indigo-600', 'text-white', 'shadow-md');
            }
        }

        async function chamarGeminiAPI(promptCompleto) {
            await new Promise(resolve => setTimeout(resolve, 800));
            const pergunta = promptCompleto.toLowerCase();

            if (pergunta.includes('imposto') || pergunta.includes('simples') || pergunta.includes('das')) {
                return `Para a empresa ${clienteAtual.split(' ')[0]}, o cálculo do Simples Nacional obedece ao anexo da atividade. O DAS vence no dia 20 do mês subsequente.`;
            } else if (pergunta.includes('dre') || pergunta.includes('lucro')) {
                return `A DRE gerencial reflete o lucro líquido operacional saudável com margem superior a 33% para ${clienteAtual.split(' ')[0]}.`;
            } else {
                return `Análise do Assistente Contábil (Gemini 1.5 Flash):\n\nA conformidade fiscal de ${clienteAtual.split(' ')[0]} está regularizada e em harmonia com as normas brasileiras de contabilidade.`;
            }
        }

        async function enviarMensagem() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const texto = inputField.value.trim();

            if (!texto) return;

            chatContainer.innerHTML += `
                <div class="bg-indigo-950/50 border border-indigo-800/50 p-3 rounded-2xl max-w-[80%] self-end text-xs">
                    <span class="font-bold text-indigo-300 block mb-1">Você:</span>
                    ${escapeHtml(texto)}
                </div>
            `;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="bg-slate-950 border border-slate-800 p-3 rounded-2xl max-w-[80%] self-start text-xs text-slate-400 italic">
                    Gemini 1.5 Flash está a processar...
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const respostaIA = await chamarGeminiAPI(texto);

            document.getElementById(loadingId).remove();
            chatContainer.innerHTML += `
                <div class="bg-slate-950 border border-slate-800 p-3 rounded-2xl max-w-[80%] text-xs">
                    <span class="font-bold text-emerald-400 block mb-1">🤖 Gemini 1.5 Flash:</span>
                    ${escapeHtml(respostaIA)}
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
